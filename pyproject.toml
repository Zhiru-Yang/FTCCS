[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftccs"
version = "1.0.0"
description = "FTCCS for hyperspectral target detection band selection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "PyYAML>=6.0",
    "h5py>=3.11",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
